const BD={Pago:'ok',Pendente:'wa',Expirado:'',Ativo:'ok',Bloqueado:'er',Standby:'wa',Inativo:'',Conectado:'ok',Demonstração:'wa','Não conectado':'',Erro:'er','Concluído':'ok',Processando:'ac','Em análise':'wa',Recusado:'er'};
const bd=t=>`<span class="b ${BD[t]||''}">${t=='Processando'?'<span class="spin" style="width:10px;height:10px"></span>':''}${esc(t)}</span>`;
const tbl=(h,r,e='Nada por aqui ainda.',cls='')=>`<div class="card tb ${cls}"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.length?r.map(x=>typeof x=='string'?x:`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="emp">${e}</td></tr>`}</tbody></table></div>`;
const bars=(l,v,f,every=1,cls='')=>{const mx=Math.max(...v,1e-9);return `<div class="bx ${cls}">${v.map((x,i)=>`<div class="bc" data-t="${esc(l[i])}: ${esc(f(x,i))}"><div class="bt"><i style="height:${Math.max(x/mx*100,1.2)}%;--d:${i*18}ms"></i></div><span>${i%every?'&nbsp;':l[i]}</span></div>`).join('')}</div>`};
const spark=(v,c='var(--ac)')=>{const w=90,h=26,mx=Math.max(...v,1e-9),pts=v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-x/mx*(h-4)).toFixed(1)}`).join(' ');return `<svg class="spk" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" style="--len:300;stroke-dashoffset:0"/></svg>`};
const dvB=(c,p)=>{if(!p&&!c)return'<span class="dv eq">—</span>';if(!p)return'<span class="dv up">novo</span>';const d=c/p-1;return `<span class="dv ${d>=.15?'up':d<=-.15?'dn':'eq'}">${d>=0?'▲':'▼'} ${pct(Math.abs(d),0)}</span>`};

const MR=()=>{const n=Date.now(),m=new Date();m.setDate(1);m.setHours(0,0,0,0);const p=new Date(m);p.setMonth(p.getMonth()-1);const el=n-m;const dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();return{n,m0:+m,p0:+p,pe:+p+el,el,dim,day:new Date().getDate(),mn:m.toLocaleDateString('pt-BR',{month:'long'}),pn:p.toLocaleDateString('pt-BR',{month:'long'})}};
const paidIn=(a,f,t)=>a.filter(x=>x.st=='Pago'&&x.pt>=f&&x.pt<t);
const genIn=(a,f,t)=>a.filter(x=>x.ts>=f&&x.ts<t&&(x.st=='Pago'||x.st=='Expirado'));
const sumA=a=>a.reduce((t,x)=>t+x.a,0),sumF=a=>a.reduce((t,x)=>t+x.f,0),sumC=a=>a.reduce((t,x)=>t+x.a*x.c,0),sumN=a=>a.reduce((t,x)=>t+x.a-x.f,0);
const conv=a=>{const g=a.length;return g?a.filter(x=>x.st=='Pago').length/g:0};
function daily(a,from,days,fn){const o=Array(days).fill(0);a.forEach(x=>{if(x.st!='Pago')return;const i=Math.floor((x.pt-from)/DAY);if(i>=0&&i<days)o[i]+=fn(x)});return o}
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return +d};

let ST=null,LASTEV=0,route='',dirty=0;
async function load(norender){let j;try{j=await (await fetch('/api/state')).json()}catch(e){return toast('Servidor offline. Rode node server.js','er')}
 if(j.auth===false){ST=null;return showLogin()}
 const roleCh=!ST||ST.role!==j.role||(j.seller&&ST.seller&&j.seller.id!==ST.seller.id)||(j.mgr&&ST.mgr&&j.mgr.id!==ST.mgr.id);ST=j;if(!LASTEV||roleCh)LASTEV=j.lastEv;
 if(roleCh){route='';const k=rk();if(location.hash.slice(1).split('?')[0]!==k)history.replaceState(null,'','#'+k)}
 $('#login').hidden=true;$('#app').hidden=false;if(norender&&typing()){dirty=1;return}render()}
async function act(a,b={},errEl){const r=await fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,act:a})});const j=await r.json().catch(()=>({error:'Falha de rede'}));
 if(!r.ok||j.error){const m=j.error||'Erro';if(errEl&&$(errEl))$(errEl).textContent=m;else toast(esc(m),'er');throw new Error(m)}await load();return j}
setInterval(async()=>{if(!ST||document.hidden)return;try{const r=await fetch('/api/poll?ev='+LASTEV);if(r.status==401){ST=null;return showLogin()}const j=await r.json();for(const e of j.ev){if(e.id<=LASTEV)continue;LASTEV=e.id;notify(e)}if(j.mode&&j.mode!==ST.mode)load();else if(j.rev!==ST.rev)load(true)}catch(e){}},2000);
const typing=()=>{const a=document.activeElement;return a&&$('#v').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)};
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!typing())render()},500));

function notify(e){
 if(ST.role=='seller'){
  if(e.s!==me().id)return;
  if(e.k=='paid')toast(`<span class="ti">${ico(I.pix,16)}</span><div>Pix pago na operação <b>${esc(e.un)}</b><br>Sua comissão: <b>${brl(e.net)}</b></div>`);
  else if(e.k=='po_done'){const p=ST.po.find(x=>x.id==e.po);pop(p||{id:e.po,a:e.a,rc:brl(e.a),x:'sua conta'})}
  else if(e.k=='po_ok')toast(`Saque de <b>${brl(e.a)}</b> aprovado — processando`,'wa');
  else if(e.k=='po_rej')toast(`Saque de <b>${brl(e.a)}</b> foi recusado. O valor voltou para o saldo.`,'er');
  else if(e.k=='dp_new')toast(`Nova disputa (MED) na operação <b>${esc(e.un)}</b> · ${brl(e.a)} — <a href="#disp">responder</a>`,'er');
  else if(e.k=='dp_res')toast(`Disputa ${e.st=='Ganha'?'ganha ✓':'perdida'} na operação <b>${esc(e.un)}</b> · ${brl(e.a)}`,e.st=='Ganha'?'ok':'er');
  else if(e.k=='blocked')toast(`Antifraude bloqueou um Pix de ${brl(e.a)} na operação <b>${esc(e.un)}</b> (${esc(e.rule)})`,'wa');
 }else if(ST.role=='gerente'){
  if(e.k=='paid')toast(`<span class="ti">${ico(I.sel,16)}</span><div>Venda na sua rede · <b>${esc(e.sn)}</b><br>Sua comissão: <b>${brl(e.cmMe)}</b></div>`);
  else if(e.k=='signup')toast(`Novo cadastro na sua rede: <b>${esc(e.sn)}</b>`);
 }else{
  if(e.k=='paid')toast(`<span class="ti">${ico(I.pix,16)}</span><div>Pix pago · <b>${brl(e.a)}</b><br>${esc(e.sn)} · ${esc(e.un)}</div>`);
  else if(e.k=='po_req'&&e.st=='Em análise')toast(`Saque aguardando aprovação: <b>${esc(e.sn)}</b> · ${brl(e.a)}`,'wa');
  else if(e.k=='po_done')toast(`Saque pago: ${esc(e.sn)} · ${brl(e.a)}`);
 }}

const V={};
const ceoData=()=>{const M=MR(),S=ST.sales;return{M,cur:paidIn(S,M.m0,M.n),prev:paidIn(S,M.p0,M.pe)}};
V.ceo=()=>{const{M,cur,prev}=ceoData(),tpv=sumA(cur),fee=sumF(cur),cost=sumC(cur),cmz=sumCm(cur),lucro=fee-cost-cmz,ptpv=sumA(prev),plucro=sumF(prev)-sumC(prev)-sumCm(prev),proj=M.el>0?tpv/(M.el/DAY)*M.dim:0,projL=M.el>0?lucro/(M.el/DAY)*M.dim:0;
 const cust=ST.sellers.reduce((t,s)=>t+s.bal,0),pend=ST.po.filter(p=>p.st=='Em análise'),gen=genIn(ST.sales,M.m0,M.n),cr=cost&&tpv?cost/tpv:0;
 const days=Array.from({length:M.day},(_,i)=>String(i+1).padStart(2,'0')),dT=daily(ST.sales,M.m0,M.day,x=>x.a),dL=daily(ST.sales,M.m0,M.day,x=>x.f-x.a*x.c-cmOf(x));
 const d=Math.abs(ptpv)?tpv/ptpv-1:0;
 return head('Visão CEO',`Mês de ${M.mn} até agora · comparado com o mesmo período de ${M.pn}`,`<span class="chiph">Atualizado ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>`)+
 kp([['TPV do mês',tpv,`${d>=0?'▲':'▼'} ${pct(Math.abs(d))} vs ${M.pn} (${brl(ptpv)})`,'m','','hl'],['Custo do TPV',cost,`${pct(cr,2)} do TPV · adquirentes`,'m','er'],['Receita de taxas',fee,`take rate ${pct(tpv?fee/tpv:0,2)}`],['Comissões de gerentes',cmz,`${pct(fee?cmz/fee:0)} das taxas · <a href="#gerentes">ver gerentes</a>`,'m','er'],['Lucro da operação',lucro,`após custo e comissões · margem ${pct(tpv?lucro/tpv:0,2)} · ${M.pn}: ${brl(plucro)}`,'m',lucro>=0?'ok':'er'],
 ['Projeção do mês',proj,`lucro projetado ${brl(projL)}`],['Pix pagos',cur.length,`ticket médio ${brl(cur.length?tpv/cur.length:0)}`,'i'],['Conversão Pix',conv(gen),`${nf(gen.length)} Pix gerados no mês`,'p'],['Saldo em custódia',cust,pend.length?`${pend.length} saque(s) aguardando · ${brl(pend.reduce((t,p)=>t+p.a,0))}`:'nenhum saque aguardando','m',pend.length?'er':'']])+
 `<div class="g2h"><div class="card"><div class="ch"><b>TPV por dia · ${M.mn}</b><small>${brl(tpv)}</small></div>${bars(days,dT,x=>brl(x),M.day>16?3:1)}</div><div class="card"><div class="ch"><b>Lucro por dia</b><small>taxas − custo do TPV</small></div>${bars(days,dL,x=>brl(x),M.day>16?3:1,'okb')}</div></div>`+
 desvioTbl(M)+acqTbl(cur,tpv)};
function desvioTbl(M){const rows=ST.sellers.map(s=>{const a=ST.sales.filter(x=>x.s==s.id),c=paidIn(a,M.m0,M.n),p=paidIn(a,M.p0,M.pe),t=sumA(c),pt=sumA(p),from=dayStart(M.n)-13*DAY;return{s,t,pt,l:sumF(c)-sumC(c)-sumCm(c),tr:t?sumF(c)/t:0,cv:conv(genIn(a,M.m0,M.n)),sp:daily(a,from,14,x=>x.a),d:pt?t/pt-1:(t?1:0)}}).sort((a,b)=>b.t-a.t),tot=rows.reduce((x,r)=>x+r.t,0)||1;
 const up=[...rows].sort((a,b)=>b.d-a.d)[0],dn=[...rows].sort((a,b)=>a.d-b.d)[0];
 return `<h3>Desvio de cada player</h3><div class="chips" style="margin-bottom:10px">${up&&up.d>0?`<span class="b ok">Maior alta: ${esc(up.s.n)} ▲ ${pct(up.d,0)}</span>`:''}${dn&&dn.d<0?`<span class="b er">Maior queda: ${esc(dn.s.n)} ▼ ${pct(-dn.d,0)}</span>`:''}<span class="b">Desvio = TPV do mês vs mesmo período de ${M.pn}</span></div>`+
 tbl(['Seller','Status','TPV do mês',M.pn+' (mesmo período)','Desvio','Participação','Lucro gerado','Take rate','Conversão','Últimos 14 dias',''],rows.map(r=>[`<b>${esc(r.s.n)}</b>`,bd(r.s.st),brl(r.t),brl(r.pt),dvB(r.t,r.pt),pct(r.t/tot),`<span class="${r.l>=0?'ok-t':'er-t'}">${brl(r.l)}</span>`,pct(r.tr,2),pct(r.cv,0),spark(r.sp,r.d<=-.15?'var(--er)':r.d>=.15?'var(--ok)':'var(--ac)'),`<button class="btn sm o" onclick="imp('${r.s.id}')">${ico(I.login,14)} Entrar</button>`]))}
function acqTbl(cur,tpv){return `<h3>Por adquirente</h3>`+tbl(['Adquirente','Status','Custo','TPV roteado','Participação','Custo no mês','Sellers'],ST.acq.map(a=>{const x=cur.filter(s=>s.acq==a.id),t=sumA(x);return[`<b>${esc(a.n)}</b>`,bd(a.st),pct(a.cost,2),brl(t),pct(tpv?t/tpv:0),brl(sumC(x)),String(ST.sellers.filter(s=>s.acq==a.id).length)]}))}

 return `<div class="card static ttc">${hd(live?(c.err?'Erro':'Conectado'):'Demonstração',sub)}${c.err?`<div class="note" style="color:var(--er)">${esc(c.err)}</div>`:''}${ctrl}

 ${tbl(['Campanha','Status','Gasto','Impressões','Cliques','CPC','Pix pagos','Comissão','ROAS','CPA'],cs.map(x=>[esc(x.n),bd(x.st),brl(x.sp),nf(x.imp),nf(x.clk),x.clk?brl(x.sp/x.clk):'—',String(x.s),brl(x.v),x.sp?xr(x.v/x.sp):'—',x.s?brl(x.sp/x.s):'—']),c.busy?'<span class="spin"></span> Carregando campanhas…':'Nenhuma campanha.')}

function ttCamps(u,c){const M=MR(),a=paidIn(ST.sales.filter(x=>x.u==u.id&&x.src=='tiktok'),M.m0,M.n);
 if(c.mode=='live'){const r=CUR2BRL[c.adv&&c.adv.currency]||1;return(c.rep?c.rep.list:[]).map(x=>{const sc=a.filter(s=>s.cp==slug(x.name)||s.cp==x.id);return{n:x.name,st:x.status,sp:x.spend*r,imp:x.imp,clk:x.clk,s:sc.length,v:sumN(sc)}})}

const cpfOk=d=>{if(!/^\d{11}$/.test(d)||/^(\d)\1+$/.test(d))return false;const v=n=>{let s=0;for(let i=0;i<n;i++)s+=+d[i]*(n+1-i);return s*10%11%10==+d[n]};return v(9)&&v(10)};
const cnpjOk=d=>{if(!/^\d{14}$/.test(d)||/^(\d)\1+$/.test(d))return false;const v=n=>{const w=n==12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];const s=w.reduce((t,x,i)=>t+x*d[i],0)%11;return(s<2?0:11-s)==+d[n]};return v(12)&&v(13)};
function pixT(k){k=String(k||'').trim();const d=k.replace(/\D/g,'');if(/^\S+@\S+\.\S{2,}$/.test(k))return['email','E-mail',k.toLowerCase()];if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k))return['evp','Chave aleatória',k.toLowerCase()];
 if(/^[\d.\-\/\s()+]+$/.test(k)){if(d.length==14&&cnpjOk(d))return['cnpj','CNPJ',d];if(d.length==11&&cpfOk(d)&&!k.startsWith('+'))return['cpf','CPF',d];const t=d.startsWith('55')&&d.length>=12?d.slice(2):d;if(/^[1-9]{2}9\d{8}$/.test(t))return['tel','Celular','+55'+t]}return null}
function ibanOk(s){s=s.replace(/\s/g,'').toUpperCase();if(!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(s))return false;const r=(s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);let m=0;for(const ch of r)m=(m*10+ +ch)%97;return m==1}
const abaOk=s=>{if(!/^\d{9}$/.test(s))return false;const d=[...s].map(Number);return(3*(d[0]+d[3]+d[6])+7*(d[1]+d[4]+d[7])+(d[2]+d[5]+d[8]))%10==0};

 if(W.bank=='Wise'){if(!W.k)return['',0];const ok=W.wt=='email'?emailOk(W.k):ibanOk(W.k);if(!ok)return[W.wt=='email'?'E-mail inválido.':'IBAN inválido.',-1];if(!W.k2)return['Válido ✓ — agora confirme',0];const n=x=>x.replace(/\s/g,'').toLowerCase();return n(W.k)==n(W.k2)?['Confirmado ✓ — os dados conferem',1]:['A confirmação não confere.',-1]}

/* ---- Documentação ---- */
function docs(){const B=ST.srv.base,pre=s=>`<pre><button class="cp" onclick="copy(this.parentElement.innerText.replace(/^Copiar\\n?/,''))">Copiar</button>${esc(s)}</pre>`,ep=(m,p)=>`<div class="ep"><i class="${m.toLowerCase()}">${m}</i>${p}</div>`;
 const T=[['visao','Visão geral'],['auth','Autenticação'],['criar','Criar cobrança Pix'],['consultar','Consultar e listar'],['simular','Simular pagamento'],['saldo','Saldo'],['saques','Saques'],['webhooks','Webhooks'],['tracking','Rastreamento'],['erros','Erros']];
 return `<div class="doc"><div class="toc">${T.map(([i,n])=>`<a href="javascript:void(0)" onclick="document.getElementById('d_${i}').scrollIntoView({behavior:'smooth'})">${n}</a>`).join('')}</div><div class="card static">
 <h2 id="d_visao">Visão geral</h2><p>API REST da Ryvo para gerar e acompanhar cobranças Pix com o nosso motor de pagamentos. Base URL:</p>${pre(B+'/v1')}<p>Valores sempre em <b>centavos</b> (inteiro): <code>9700</code> = R$ 97,00. Datas em ISO 8601 UTC. Cada credencial pertence a <b>uma subconta</b> — a cobrança cai na operação dessa subconta.</p>
 <h2 id="d_auth">Autenticação (OAuth 2.0 client credentials)</h2>${ep('POST','/v1/oauth/token')}<p>Envie <code>client_id:client_secret</code> em Basic Auth. O token vale 1 hora.</p>${pre(`curl -X POST ${B}/v1/oauth/token \\\n  -u "CLIENT_ID:CLIENT_SECRET" \\\n  -H "Content-Type: application/json" \\\n  -d '{"grant_type":"client_credentials"}'`)}${pre(`{\n  "access_token": "at_9f2c...",\n  "token_type": "Bearer",\n  "expires_in": 3600,\n  "scope": "charges payouts balance"\n}`)}<p>Use nas próximas chamadas: <code>Authorization: Bearer &lt;access_token&gt;</code></p>
 <h2 id="d_criar">Criar cobrança Pix</h2>${ep('POST','/v1/pix/charges')}<p>Campos: <code>amount</code> (obrigatório, centavos), <code>description</code>, <code>external_id</code> (seu pedido), <code>expires_in</code> (segundos, 60–86400, padrão 3600), <code>tracking</code> (parâmetros da URL), <code>payer</code> (<code>name</code>, <code>email</code>, <code>document</code> — usado pelo antifraude e pelos pixels). Header opcional <code>Idempotency-Key</code> evita cobrança duplicada.</p>${pre(`curl -X POST ${B}/v1/pix/charges \\\n  -H "Authorization: Bearer $TOKEN" \\\n  -H "Content-Type: application/json" \\\n  -H "Idempotency-Key: pedido-1234" \\\n  -d '{\n    "amount": 9700,\n    "description": "Curso Pro",\n    "external_id": "pedido-1234",\n    "tracking": { "utm_source": "tiktok", "utm_campaign": "ugc-01", "ttclid": "E.C.P.abc" }\n  }'`)}${pre(`{\n  "id": "px_7k2a9f3c1",\n  "txid": "a81f0c...",\n  "status": "pending",\n  "amount": 9700,\n  "fee": 584,\n  "net": 9116,\n  "description": "Curso Pro",\n  "external_id": "pedido-1234",\n  "subaccount": { "id": "sub_...", "name": "Drop Brasil" },\n  "brcode": "00020101021226...6304ABCD",\n  "expires_at": "2026-11-16T15:00:00.000Z",\n  "paid_at": null,\n  "tracking": { "utm_source": "tiktok", ... }\n}`)}<p>Mostre o <code>brcode</code> como QR Code e como “Pix copia e cola”. <code>net</code> é a sua comissão (valor − taxa).</p>
 <h2 id="d_consultar">Consultar e listar</h2>${ep('GET','/v1/pix/charges/{id}')}${ep('GET','/v1/pix/charges?status=paid&limit=20')}${pre(`curl ${B}/v1/pix/charges/px_7k2a9f3c1 -H "Authorization: Bearer $TOKEN"`)}<p>Status: <code>pending</code>, <code>paid</code>, <code>expired</code>, <code>blocked</code> (barrada pelo antifraude da subconta).</p>
 <h2 id="d_simular">Simular pagamento (testes)</h2>${ep('POST','/v1/pix/charges/{id}/simulate-payment')}<p>Marca a cobrança como paga, credita a comissão e dispara webhook + pixels — igual a um pagamento real.</p>${pre(`curl -X POST ${B}/v1/pix/charges/px_7k2a9f3c1/simulate-payment -H "Authorization: Bearer $TOKEN"`)}
 <h2 id="d_saldo">Saldo</h2>${ep('GET','/v1/balance')}${pre(`{ "available": 291659, "currency": "BRL" }`)}
 <h2 id="d_saques">Saques</h2>${ep('POST','/v1/payouts')}${ep('GET','/v1/payouts/{id}')}<p>Envia Pix do seu saldo. Se a sua conta exige aprovação, o status começa em <code>under_review</code>; senão <code>processing</code> e depois <code>paid</code>.</p>${pre(`curl -X POST ${B}/v1/payouts \\\n  -H "Authorization: Bearer $TOKEN" \\\n  -H "Content-Type: application/json" \\\n  -d '{ "amount": 50000, "pix_key": "voce@email.com" }'`)}
 <h2 id="d_webhooks">Webhooks</h2><p>Cadastre a URL por subconta (acima). Eventos: <code>charge.paid</code>, <code>charge.expired</code>, <code>payout.paid</code>, <code>ping</code>. Cada POST traz <code>X-Bluvia-Event</code> e <code>X-Bluvia-Signature: sha256=&lt;HMAC do corpo com seu segredo&gt;</code>.</p>${pre(`// Node.js — validar assinatura\nconst crypto = require('crypto');\nfunction valido(rawBody, header, segredo) {\n  const esperado = 'sha256=' + crypto.createHmac('sha256', segredo).update(rawBody).digest('hex');\n  return crypto.timingSafeEqual(Buffer.from(header), Buffer.from(esperado));\n}`)}${pre(`{\n  "id": "evt_3c9a...",\n  "event": "charge.paid",\n  "created_at": "2026-11-16T14:02:11.000Z",\n  "data": { "id": "px_7k2a9f3c1", "status": "paid", "amount": 9700, "net": 9116, ... }\n}`)}
 <h2 id="d_tracking">Rastreamento</h2><p>Repasse em <code>tracking</code> os parâmetros que chegaram na URL do seu checkout (<code>utm_*</code>, <code>src</code>, <code>sck</code>, <code>ttclid</code>, <code>fbclid</code>, <code>gclid</code> e os personalizados da subconta). A Ryvo classifica a origem e, quando o Pix é pago, envia a compra para TikTok (Events API) e Meta (Conversions API) conectados na subconta — do servidor, sem depender do navegador do comprador.</p>
 <h2 id="d_erros">Erros</h2><p>Formato: <code>{"error":{"code":"...","message":"..."}}</code></p>${tbl(['HTTP','code','Quando'],[['401','invalid_client / invalid_token','credencial ou token inválido/expirado'],['403','seller_blocked','conta bloqueada'],['404','not_found','recurso não existe ou é de outra conta'],['409','not_pending','cobrança já paga/expirada'],['422','invalid_amount / invalid_pix_key / insufficient_balance','dados inválidos'],['422','blocked_by_antifraud','regra de antifraude da subconta barrou o pagamento']].map(r=>r.map(c=>`<span class="${c.length<5?'mono':''}">${esc(c)}</span>`)))}
 </div></div>`}
V.docs=()=>head('Documentação da API Pix','O que os sellers usam para integrar')+docs();

/* ================= GERENTE ================= */
const G=()=>ST.mgr,refUrl=()=>ST.srv.base+'/cadastro/'+G().code;
const shareTxt=()=>pct(G().share,0)+' do lucro'+(G().share2?` + ${pct(G().share2,0)} nos indiretos`:'');
function netStats(){const M=MR(),t0=dayStart(M.n),f30=M.n-30*DAY;return ST.net.map(n=>{const a=ST.sales.filter(x=>x.s==n.id),p30=a.filter(x=>x.st=='Pago'&&x.pt>=f30),g30=a.filter(x=>x.ts>=f30&&(x.st=='Pago'||x.st=='Expirado')),pm=a.filter(x=>x.st=='Pago'&&x.pt>=M.m0);return{...n,fat:sumA(p30),vendas:p30.length,gen:g30.length,conv:g30.length?p30.length/g30.length:null,cm30:p30.reduce((t,x)=>t+x.cm,0),hoje:a.filter(x=>x.st=='Pago'&&x.pt>=t0).length,tpvM:sumA(pm),cmM:pm.reduce((t,x)=>t+x.cm,0)}})}
// gráfico de área suave
function area(v,l,f){const W=1000,H=230,P=40,mx=Math.max(...v,1e-9)*1.15,X=i=>P+i*(W-P-10)/Math.max(v.length-1,1),Y=x=>H-22-(x/mx)*(H-40),pts=v.map((x,i)=>[X(i),Y(x)]);
 let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}
 const g=[0,.25,.5,.75,1].map(k=>`<path d="M${P} ${Y(mx/1.15*k)}H${W}" stroke="var(--bd)" stroke-dasharray="4 6"/><text x="${P-6}" y="${Y(mx/1.15*k)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${f(mx/1.15*k)}</text>`).join('');
 const every=Math.ceil(v.length/8);
 return `<svg class="area" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:${H}px"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--pr)" stop-opacity=".45"/><stop offset="1" stop-color="var(--pr)" stop-opacity="0"/></linearGradient></defs>${g}<path d="${d} L${pts[pts.length-1][0]},${H-22} L${pts[0][0]},${H-22}Z" fill="url(#ag)"/><path class="ln" d="${d}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--ac)" class="dot"><title>${l[i]}: ${f(v[i])}</title></circle>${i%every==0||i==v.length-1?`<text x="${p[0]}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--mu)">${l[i]}</text>`:''}`).join('')}</svg>`}
let GPER=7,GF='todos';
V.g_home=()=>{const g=G(),ns=netStats(),idle=ns.filter(n=>n.st=='Ativo'&&!n.hoje),M=MR(),from=dayStart(M.n)-(GPER-1)*DAY,dv=daily(ST.sales.filter(x=>x.cm),from,GPER,x=>x.cm),dl=Array.from({length:GPER},(_,i)=>new Date(from+i*DAY).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));
 const top=[...ns].sort((a,b)=>b.tpvM-a.tpvM).slice(0,5);
 return `<div class="eyebrow">Gerente de contas</div><h1>Painel</h1><p class="sub">${esc(g.n)} · sua fatia: ${shareTxt()}</p>`+
 (idle.length?`<div class="alertb">${ico(I.alert,18)}<span><b>${idle.length} player${idle.length>1?'s':''} da sua rede não rodaram hoje.</b> Vale chamar pra entender o que aconteceu.</span><a href="#g_rede" onclick="GF='idle'">Ver quem →</a></div>`:`<div class="alertb ok">${ico(I.pix,18)}<span><b>Toda a sua rede já vendeu hoje.</b> Bom trabalho.</span></div>`)+
 `<div class="g2h"><div class="card hlc"><small>Seu saldo de comissões</small><div class="big" data-k="m" data-v="${g.bal}">${brl(g.bal)}</div><div class="split"><div><small>% Comissões recebidas</small><b class="mono">${brl(g.earn)}</b></div><div><small>Sua fatia</small><b>${shareTxt()}</b></div></div><a class="btn big" href="#g_wallet" style="margin-top:14px">Ver carteira →</a></div>
 <div class="card"><div class="ch"><span class="src">${ico(I.w,18)} Total transferido</span><span class="b ok">Para sua conta de seller</span></div><div class="big">${brl(g.out)}</div><p class="sub" style="margin:0 0 10px">${ST.mt.length} transferência(s) · disponível agora ${brl(g.bal)}</p><a href="#g_wallet" style="font-weight:600">Transferir e ver o histórico</a><p class="sub" style="font-size:12px;margin:8px 0 0">O saque é feito pela sua conta, no modo Seller.</p></div></div>`+
 `<div class="card"><div class="ch"><div><b>Minhas comissões</b><br><small>Últimos ${GPER} dias</small></div><span class="tgl">${[7,14,30].map(d=>`<button class="${d==GPER?'on':''}" onclick="GPER=${d};render()">${d} dias</button>`).join('')}</span></div><small style="margin-top:10px;letter-spacing:.08em;text-transform:uppercase">Total no período</small><div style="font:700 24px 'JetBrains Mono',monospace;margin-bottom:6px">${brl(dv.reduce((a,b)=>a+b,0))}</div>${area(dv,dl,x=>brl(x))}</div>`+
 kp([['TPV da rede no mês',ns.reduce((t,n)=>t+n.tpvM,0),ns.length+' players'],['Comissão no mês',ns.reduce((t,n)=>t+n.cmM,0),'sua parte do lucro'],['Rodaram hoje',ns.filter(n=>n.hoje).length,'de '+ns.filter(n=>n.st=='Ativo').length+' ativos','i']])+
 `<h3>Top players do mês</h3>`+tbl(['#','Player','TPV no mês','Sua comissão'],top.map((n,i)=>[medal(i),`<b>${esc(n.n)}</b>`,brl(n.tpvM),`<span class="ok-t">${brl(n.cmM)}</span>`]),'Sua rede ainda não vendeu este mês.')};
const medal=i=>i<3?`<span class="medal m${i}">${i+1}</span>`:`<span class="medal">${i+1}</span>`;

V.g_links=()=>{const g=G(),u=refUrl(),dir=ST.net.filter(n=>n.lvl==1).sort((a,b)=>b.ts-a.ts);let qr='';try{if(window.qrcode){const q=qrcode(0,'M');q.addData(u);q.make();qr=`<div class="qr">${q.createSvgTag({cellSize:4,margin:2,scalable:true})}</div>`}}catch(e){}
 return `<div class="eyebrow">Gerente de contas</div><h1>Meus links</h1><p class="sub">Quem se cadastra pelo seu link entra direto na sua rede</p>`+
 `<div class="card static"><div class="row" style="align-items:flex-start;gap:18px">${qr}<div style="flex:1;min-width:240px"><b>Seu link de indicação</b><div class="brc" style="font-size:13px">${esc(u)}</div><div class="row"><button class="btn" onclick="copy('${u}')">Copiar link</button><a class="btn o" href="${u}" target="_blank" rel="noopener">Abrir página de cadastro</a></div><p class="sub" style="margin:10px 0 0">Você ganha <b style="color:var(--tx)">${shareTxt()}</b> da Bluvia em cada venda dos players indicados. Lucro = taxa cobrada do seller − custo de processar a venda.</p></div></div></div>`+
 kp([['Indicados diretos',dir.length,'cadastrados pelo seu link ou pelo CEO','i'],['Cadastros nos últimos 30 dias',dir.filter(n=>n.ts>Date.now()-30*DAY).length,'','i']])+
 `<h3>Últimos cadastros</h3>`+tbl(['Player','E-mail','Cadastro','Status'],dir.slice(0,15).map(n=>[`<b>${esc(n.n)}</b>`,esc(n.email),dt(n.ts),bd(n.st)]),'Ninguém se cadastrou ainda. Compartilhe seu link.')};

V.g_rede=()=>{const ns=netStats(),dir=ns.filter(n=>n.lvl==1),ind=ns.filter(n=>n.lvl==2),show=n=>GF!='idle'||(n.st=='Ativo'&&!n.hoje);
 const row=n=>`<div class="nrow ${n.lvl==2?'ind':''}" data-q="${esc((n.n+' '+n.email).toLowerCase())}" ${show(n)?'':'hidden'}><span class="av">${esc(n.n[0])}</span><div class="nm"><b>${esc(n.n)}</b>${n.mgr?' <span class="b ac">gerente</span>':''}${n.st!='Ativo'?' '+bd(n.st):''}${n.st=='Ativo'&&!n.hoje?' <span class="b wa">não rodou hoje</span>':''}<br><small>${esc(n.email)}${n.lvl==2?' · via '+esc((ns.find(x=>x.id==n.via)||{}).n||''):''}</small></div><div class="mt"><small>Faturou (30d)</small><b>${brl(n.fat)}</b><small>${n.vendas} vendas</small></div><div class="mt"><small>Conversão Pix</small><b>${n.conv==null?'sem Pix':pct(n.conv)}</b>${n.cm30?`<small class="ac-t">rendeu ${brl(n.cm30)}</small>`:'<small>&nbsp;</small>'}</div></div>`;
 return `<div class="card static hlc"><div class="eyebrow">% Sua comissão</div><div class="big" style="margin:2px 0 6px">${pct(G().share,0)}</div><p class="sub" style="margin:0">do lucro da Ryvo em cada venda da sua rede${G().share2?` (e ${pct(G().share2,0)} nas vendas dos indiretos)`:''}. Lucro é a taxa cobrada do seller menos o custo de processar a venda. O valor entra no seu saldo quando o Pix é pago.</p></div>`+
 kp([['Total na rede',ns.length,'','i','','hl'],['Indicados diretos',dir.length,'','i'],['Indicados indiretos',ind.length,'','i'],['Bloqueados',ns.filter(n=>n.st=='Bloqueado').length,'','i']])+
 `<div class="card static" style="padding:0"><div class="ch" style="padding:14px 16px;border-bottom:1px solid var(--bd)"><span class="row" style="margin:0"><b>${ico(I.sel,16)} Minha hierarquia</b><input class="in" placeholder="Procurar por nome ou e-mail" oninput="gsearch(this.value)" style="width:260px"></span><span class="row" style="margin:0"><span class="tgl"><button class="${GF=='todos'?'on':''}" onclick="GF='todos';render()">Todos</button><button class="${GF=='idle'?'on':''}" onclick="GF='idle';render()">Não rodaram hoje</button></span><button class="btn sm o" onclick="document.querySelectorAll('.nrow.ind').forEach(r=>r.hidden=false)">Expandir</button><button class="btn sm o" onclick="document.querySelectorAll('.nrow.ind').forEach(r=>r.hidden=true)">Recolher</button></span></div><div style="padding:14px 16px">
 <div class="nrow me"><span class="av">${esc(G().n[0])}</span><div class="nm"><b>${esc(G().n)}</b><br><small class="ac-t">Você</small></div></div>
 ${dir.map(d=>row(d)+ind.filter(i=>i.via==d.id).map(row).join('')).join('')||'<p class="sub">Sua rede ainda está vazia. Compartilhe seu link em Meus links.</p>'}</div></div>`};
function gsearch(q){q=q.trim().toLowerCase();document.querySelectorAll('.nrow[data-q]').forEach(r=>r.hidden=!!q&&!r.dataset.q.includes(q))}

let GVF='Todas',GVL=30;
V.g_vendas=()=>{const nm=id=>(ST.net.find(n=>n.id==id)||{}).n||'—',a=ST.sales.slice().reverse(),l=a.filter(x=>GVF=='Todas'||x.st==GVF),M=MR(),pm=a.filter(x=>x.st=='Pago'&&x.pt>=M.m0);
 return `<div class="eyebrow">Gerente de contas</div><h1>Vendas da rede</h1><p class="sub">Últimos 60 dias · sua comissão em cada Pix pago</p>`+kp([['TPV da rede no mês',sumA(pm),pm.length+' Pix pagos'],['Sua comissão no mês',pm.reduce((t,x)=>t+x.cm,0),shareTxt()],['Pendentes agora',a.filter(x=>x.st=='Pendente').length,'aguardando pagamento','i']])+
 `<div class="row"><span class="tgl">${['Todas','Pago','Pendente','Expirado','Bloqueado'].map(x=>`<button class="${x==GVF?'on':''}" onclick="GVF='${x}';GVL=30;render()">${x}</button>`).join('')}</span><span class="chiph">${nf(l.length)} venda(s)</span></div>`+
 tbl(['Player','Valor','Sua comissão','Status','Quando'],l.slice(0,GVL).map(x=>[`<b>${esc(nm(x.s))}</b>`,brl(x.a),x.st=='Pago'?`<b class="ok-t">${brl(x.cm)}</b>`:'—',bd(x.st),ago(x.pt||x.ts)]),'Nenhuma venda na rede.')+(l.length>GVL?`<button class="btn o" onclick="GVL+=30;render()">Carregar mais</button>`:'')};

V.g_wallet=()=>{const g=G();return `<div class="eyebrow">Gerente de contas</div><h1>Carteira</h1><p class="sub">Suas comissões entram aqui. Para sacar, transfira para a sua conta de seller.</p>`+
 kp([['Saldo de comissões',g.bal,'disponível para transferir','m','','hl'],['Comissões recebidas',g.earn,'desde o início'],['Já transferido',g.out,ST.mt.length+' transferência(s)']])+
 `<div class="g2e"><div class="card static" id="gwc"><b>Transferir para a conta de seller</b><p class="sub" style="margin:4px 0 0">Cai na hora no saldo da subconta escolhida. De lá você saca por Pix, Wise ou Inter Global.</p>
 <label class="lb">Valor</label><div class="fm"><input id="gt_a" type="number" min="1" step="0.01" placeholder="R$ 0,00"><button class="btn o" onclick="$('#gt_a').value=(${g.bal}).toFixed(2)">Máx.</button></div>
 <label class="lb">Subconta de destino</label><select id="gt_u" class="sel" style="width:100%">${g.subs.map(u=>`<option value="${u.id}">${esc(u.n)} — saldo ${brl(u.bal)}</option>`).join('')}</select>
 <button class="btn big" onclick="gTransfer()">Transferir</button><small class="err" id="gt_e"></small></div>
 <div class="card static"><b>Como funciona</b><div class="sum"><div><span>Comissões recebidas (Pix pagos da rede)</span><b>${brl(g.earn)}</b></div><div><span>− Transferido para a conta de seller</span><b>${brl(g.out)}</b></div><div class="tot"><span>= Saldo de comissões</span><b class="ok">${brl(g.bal)}</b></div></div><button class="btn o" style="margin-top:12px" onclick="switchMode('seller')">${ico(I.usr,16)} Ir para o modo Seller e sacar</button></div></div>`+
 `<h3>Histórico</h3>`+tbl(['Transferência','Destino','Valor','Quando'],ST.mt.map(t=>[`<span class="mono">${t.id.slice(0,10)}</span>`,esc((g.subs.find(u=>u.id==t.u)||{}).n||'—'),`<b>${brl(t.a)}</b>`,dt(t.ts)]),'Nenhuma transferência ainda.')};
async function gTransfer(){const a=+$('#gt_a').value;try{await act('mgrTransfer',{a,u:$('#gt_u').value},'#gt_e');toast(`Transferido <b>${brl(a)}</b> para a sua conta de seller`)}catch(e){const c=$('#gwc');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}}

V.g_rank=()=>{const ns=netStats().sort((a,b)=>b.tpvM-a.tpvM),r=ST.rank,pos=r.findIndex(x=>x.id==G().id);
 return `<div class="eyebrow">Gerente de contas</div><h1>Ranking</h1><p class="sub">Mês de ${MR().mn}</p>`+
 `<div class="g2h"><div class="card hlc"><small>Sua posição entre os gerentes</small><div class="big">${pos>=0?'#'+(pos+1):'—'} <span style="font-size:16px;color:var(--mu)">de ${r.length}</span></div><p class="sub" style="margin:0">TPV da sua rede no mês: <b style="color:var(--tx)">${brl(pos>=0?r[pos].tpv:0)}</b>${pos>0?` · faltam ${brl(r[pos-1].tpv-r[pos].tpv)} para passar o #${pos}`:''}</p></div>
